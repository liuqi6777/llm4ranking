name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m compileall -q src
      - run: python -m build
      - run: python -c "from setuptools import find_packages; assert 'llm4ranking.evaluation' in find_packages('src'); assert 'llm4ranking.training.pointwise' in find_packages('src')"
